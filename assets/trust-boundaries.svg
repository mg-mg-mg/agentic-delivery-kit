<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kit-trust-boundaries-title kit-trust-boundaries-desc" id="kit-root">
<title id="kit-trust-boundaries-title">Agentic Delivery Kit trust boundaries</title>
<desc id="kit-trust-boundaries-desc">Architecture with two trust zones. Only the trusted dispatcher holds GitHub credentials: it takes opted-in Issues, commits, pushes, opens PRs and performs head-pinned squash merges, serialized by an integration lease, under the Owner&#x27;s opt-in label, configuration and containment assertions. The author (writes its own worktree only), reviewer (read-only at fixed head and base) and verifier (runs reviewer-selected checks) run without credentials or tool networking; they reach only the model API, which has its own login.</desc>
<defs>
      <style>#kit-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: #2d3142; }
      #kit-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#kit-root .diagram-container { overflow-x: visible; }
}</style><pattern id="kit-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/></pattern><marker id="kit-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="kit-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/></marker><marker id="kit-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker></defs>
